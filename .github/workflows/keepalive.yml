# GitHub switches scheduled workflows OFF in a repository that has had no commits for 60 days.
# Twice a month this job rewrites one small text file and commits it, so the Notifier schedule
# never goes quiet even if the app itself is left untouched for a long time.
name: Keep notifier alive

on:
  schedule:
    - cron: '17 3 1,15 * *'      # 1st and 15th of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Commit a fresh date stamp
        run: |
          date -u +"Last keep-alive: %Y-%m-%d %H:%M UTC" > notifier/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifier/keepalive.txt
          git commit -m "Keep the notifier schedule active" || exit 0
          git push
